name: Universal Android APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Detect and Extract ZIP
        id: zip_info
        run: |
          ZIP_FILE=$(git show --pretty="" --name-only HEAD | grep '\.zip$' | head -n 1)
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "Koi bhi .zip file nahi mili!"
            exit 1
          fi

          APP_NAME=$(basename "$ZIP_FILE" .zip | tr ' ' '_' | tr -cd '[:alnum:]._-')
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Building from: $ZIP_FILE"

          mkdir -p extracted_src
          unzip -q "$ZIP_FILE" -d extracted_src

      - name: Generate debug.keystore & Build APK
        run: |
          SETTINGS_FILE=$(find extracted_src \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          GRADLE_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project root: $GRADLE_DIR"
          cd "$GRADLE_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip_info.outputs.app_name }}-apk
          path: extracted_src/**/app/build/outputs/apk/debug/*.apk
